<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des étudiants</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestion des étudiants</h1>
            <p>Ajoutez un étudiant et suivez la liste des étudiants en temps réel.</p>
        </header>

        <section class="form-section">
            <h2>Ajouter un étudiant</h2>
            <form id="student-form">
                <div class="form-row">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-row">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-row">
                    <label for="age">Âge</label>
                    <input type="number" id="age" name="age" min="10" max="100" required>
                </div>
                <div class="form-row">
                    <label for="classe">Classe</label>
                    <input type="text" id="classe" name="classe" required>
                </div>
                <div class="form-actions">
                    <button type="submit">Ajouter</button>
                </div>
                <div id="form-status" class="form-status"></div>
            </form>
        </section>

        <section class="list-section">
            <h2>Liste des étudiants</h2>
            <div id="list-message" class="info">Aucun étudiant ajouté pour le moment.</div>
            <table id="students-table" class="hidden">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Âge</th>
                        <th>Classe</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <script src="students.js"></script>
</body>
</html>
